[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusic-mirror"
version = "0.8.0"
description = "Mirror your public YouTube Music playlists to a local folder of MP3 albums"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "suleman-dawood" }]
keywords = ["youtube", "youtube-music", "playlist", "sync", "mp3", "yt-dlp"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "yt-dlp",
    "mutagen",
    "pillow",
    "langcodes",
    "requests",
]

[project.optional-dependencies]
web = ["fastapi", "uvicorn", "apscheduler"]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "fastapi",
    "uvicorn",
    "apscheduler",
    "pylint",
]

[project.scripts]
ytmusic-mirror = "ytmusic_mirror.cli:main"

[tool.setuptools]
packages = ["ytmusic_mirror"]

[tool.setuptools.package-data]
ytmusic_mirror = ["ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: network tests; run with YT_MIRROR_LIVE=1",
]

[tool.pylint."messages control"]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring: repo intentionally has no docstrings
    "C0103",  # invalid-name: camelCase imported bindings are intentional
    "C0301",  # line-too-long
    "C0415",  # import-outside-toplevel: lazy imports keep web optional
    "R0401",  # cyclic-import: same lazy-import design
    "R0902",  # too-many-instance-attributes
    "R0912",  # too-many-branches
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "R0917",  # too-many-positional-arguments
    "R1721",  # unnecessary-comprehension: intentional copy
    "R1732",  # consider-using-with: acquire(blocking=False) has no `with` form
    "W0108",  # unnecessary-lambda
    "W0212",  # protected-access: same-module internal state
    "W0718",  # broad-exception-caught: deliberate robustness
]
max-line-length = 100
