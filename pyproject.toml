[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusic-mirror"
version = "0.6.0"
description = "Mirror your public YouTube Music playlists to a local folder of MP3 albums"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "suleman-dawood" }]
keywords = ["youtube", "youtube-music", "playlist", "sync", "mp3", "yt-dlp"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "yt-dlp",
    "mutagen",
    "pillow",
    "langcodes",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ytmusic-mirror = "ytmusic_mirror.cli:main"

[tool.setuptools]
packages = ["ytmusic_mirror"]

[tool.setuptools.package-data]
ytmusic_mirror = ["vendor/*.py", "vendor/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
