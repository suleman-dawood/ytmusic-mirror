name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! Describe the problem you're solving, not just the solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The scenario and why the current tool doesn't cover it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested behavior
      description: What should happen? Include examples if useful.
