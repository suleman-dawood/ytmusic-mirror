name: release

# Publishes GitHub Release assets + PyPI on version tags, and bumps the
# Homebrew tap. Steps that need a secret are skipped until it is provided
# (see docs/RELEASING.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
  HOMEBREW_PAT: ${{ secrets.HOMEBREW_PAT }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        if: ${{ env.PYPI_TOKEN != '' }}
        run: python -m twine upload -u __token__ -p "$PYPI_TOKEN" dist/*

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

      - name: Bump Homebrew tap
        if: ${{ env.HOMEBREW_PAT != '' }}
        run: bash scripts/bump-homebrew.sh
